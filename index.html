<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KampusFlow — Task Manager</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind custom config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50:  "#eff6ff",
                100: "#dbeafe",
                500: "#3b82f6",
                600: "#2563eb",
                700: "#1d4ed8",
              },
              accent: {
                400: "#fb923c",
                500: "#f97316",
                600: "#ea580c",
              },
            },
            fontFamily: {
              sans: ['"Inter"', "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom styles -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- ===== HEADER ===== -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
      <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
        <!-- Logo / Brand -->
        <div class="flex items-center gap-2">
          <!-- Simple SVG graduation-cap icon -->
          <svg class="w-7 h-7 text-brand-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 3L2 8l10 5 10-5-10-5zM2 13l10 5 10-5M2 18l10 5 10-5" />
          </svg>
          <span class="text-xl font-bold tracking-tight text-brand-700">KampusFlow</span>
        </div>
        <!-- Task counter badge -->
        <span id="task-count"
          class="text-xs font-semibold bg-brand-100 text-brand-700 px-3 py-1 rounded-full">
          0 tasks
        </span>
      </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="max-w-2xl mx-auto px-4 py-8 space-y-6">

      <!-- Input card -->
      <section aria-label="Add new task">
        <div class="bg-white rounded-2xl shadow-soft p-5 border border-slate-100">
          <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">
            New Task
          </h2>
          <form id="task-form" class="flex flex-col sm:flex-row gap-3" novalidate>
            <input
              id="task-input"
              type="text"
              placeholder="What do you need to do today?"
              maxlength="120"
              autocomplete="off"
              class="flex-1 rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm
                     placeholder-slate-400 outline-none focus:border-brand-500 focus:ring-2
                     focus:ring-brand-100 transition"
              aria-label="Task description"
            />
            <button
              type="submit"
              class="btn-primary flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl
                     bg-brand-600 hover:bg-brand-700 active:scale-95 text-white text-sm font-semibold
                     transition-all duration-150 whitespace-nowrap shadow-md"
            >
              <!-- Plus icon -->
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
              Add Task
            </button>
          </form>
          <!-- Inline validation message -->
          <p id="input-error" class="hidden mt-2 text-xs text-red-500" role="alert"></p>
        </div>
      </section>

      <!-- Filter tabs + actions -->
      <section aria-label="Filter tasks">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <!-- Filter buttons -->
          <div id="filter-tabs" class="flex gap-1 bg-white border border-slate-200 rounded-xl p-1 shadow-sm" role="tablist" aria-label="Filter tasks">
            <button data-filter="all"       class="filter-tab active-tab" role="tab" aria-selected="true">All</button>
            <button data-filter="active"    class="filter-tab" role="tab" aria-selected="false">Active</button>
            <button data-filter="completed" class="filter-tab" role="tab" aria-selected="false">Completed</button>
          </div>
          <!-- Clear completed -->
          <button
            id="clear-completed"
            class="text-xs text-slate-400 hover:text-red-500 font-medium transition hidden"
          >
            Clear completed
          </button>
        </div>
      </section>

      <!-- Task list -->
      <section aria-label="Task list">
        <ul id="task-list" class="space-y-3" aria-live="polite" aria-relevant="additions removals">
          <!-- Tasks are injected here by script.js -->
        </ul>

        <!-- Empty state -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center">
          <svg class="w-14 h-14 text-slate-200 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2
                 M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          <p id="empty-message" class="text-slate-400 text-sm font-medium">No tasks yet. Add one above!</p>
        </div>
      </section>

    </main>

    <!-- ===== EDIT MODAL ===== -->
    <div
      id="edit-modal"
      class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/40 backdrop-blur-sm px-4"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-4 animate-modal">
        <h3 id="modal-title" class="text-base font-semibold text-slate-700">Edit Task</h3>
        <input
          id="edit-input"
          type="text"
          maxlength="120"
          autocomplete="off"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm
                 placeholder-slate-400 outline-none focus:border-brand-500 focus:ring-2
                 focus:ring-brand-100 transition"
          aria-label="Edit task description"
        />
        <p id="edit-error" class="hidden text-xs text-red-500" role="alert"></p>
        <div class="flex justify-end gap-2 pt-1">
          <button id="modal-cancel" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-500
            hover:bg-slate-100 transition">Cancel</button>
          <button id="modal-save"
            class="px-5 py-2 rounded-xl text-sm font-semibold text-white bg-brand-600
                   hover:bg-brand-700 active:scale-95 transition-all shadow-md">
            Save Changes
          </button>
        </div>
      </div>
    </div>

    <!-- ===== TOAST NOTIFICATION ===== -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50
      bg-slate-800 text-white text-sm font-medium px-5 py-3 rounded-xl shadow-lg
      opacity-0 pointer-events-none transition-all duration-300 whitespace-nowrap"
      aria-live="polite">
    </div>

    <!-- Main script -->
    <script src="script.js"></script>
  </body>
</html>
